<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stock Alerts</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0a0a0a;color:#e0e0e0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  padding:0 0 100px 0;
  -webkit-text-size-adjust:100%;
}
.header{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 20px 8px;position:sticky;top:0;background:#0a0a0a;z-index:10;
}
.header h1{font-size:22px;font-weight:700;color:#fff}
.gear-btn{
  background:none;border:none;color:#888;font-size:24px;cursor:pointer;
  padding:8px;border-radius:8px;
}
.gear-btn:active{background:#1a1a1a}

.section{padding:8px 16px}
.section-title{font-size:13px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin:16px 4px 8px}

/* Setup banner */
.setup-banner{
  background:#1a1a1a;border-radius:16px;padding:20px;margin:8px 16px;
  border:1px solid #333;
}
.setup-banner h2{font-size:17px;color:#fff;margin-bottom:4px}
.setup-banner .note{font-size:12px;color:#666;margin-bottom:16px}
.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:13px;color:#888;margin-bottom:4px}
.input-group input{
  width:100%;background:#0a0a0a;border:1px solid #333;border-radius:10px;
  padding:12px 14px;color:#fff;font-size:16px;outline:none;
}
.input-group input:focus{border-color:#0a84ff}
.btn{
  width:100%;padding:14px;border-radius:12px;border:none;font-size:16px;
  font-weight:600;cursor:pointer;
}
.btn-primary{background:#0a84ff;color:#fff}
.btn-primary:active{background:#0070d6}
.btn-danger{background:#ff3b30;color:#fff}
.btn-danger:active{background:#d63029}
.btn-secondary{background:#2a2a2a;color:#fff;margin-top:8px}
.btn-secondary:active{background:#3a3a3a}

/* Alert cards */
.alert-card{
  background:#1a1a1a;border-radius:14px;padding:14px 16px;margin-bottom:10px;
  border-left:4px solid #333;position:relative;
}
.alert-card.above{border-left-color:#30d158}
.alert-card.below{border-left-color:#ff453a}
.alert-card.disabled{opacity:0.5}
.alert-card .row{display:flex;justify-content:space-between;align-items:center}
.alert-card .symbol{font-size:18px;font-weight:700;color:#fff}
.alert-card .name{font-size:13px;color:#888;margin-top:2px}
.alert-card .prices{text-align:right}
.alert-card .current{font-size:17px;font-weight:600;color:#fff}
.alert-card .target{font-size:13px;color:#888;margin-top:2px;cursor:pointer;border-bottom:1px dashed #555}
.alert-card .target:active{color:#0a84ff}
.alert-card .condition-badge{
  display:inline-block;font-size:11px;font-weight:600;
  padding:2px 8px;border-radius:6px;margin-top:4px;cursor:pointer;
}
.alert-card .condition-badge:active{opacity:0.7}
.alert-card .condition-badge.above{background:#0d3a1a;color:#30d158}
.alert-card .condition-badge.below{background:#3a0d0d;color:#ff453a}
.alert-card .actions{display:flex;gap:12px;align-items:center;margin-top:10px}
.alert-card .price-diff{font-size:11px;margin-top:2px}
.alert-card .price-diff.near{color:#ff9f0a}
.alert-card .price-diff.far{color:#888}

/* Edit modal */
.edit-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);
  z-index:60;display:none;align-items:center;justify-content:center;
}
.edit-overlay.show{display:flex}
.edit-modal{
  background:#1c1c1e;border-radius:16px;padding:24px;
  width:90%;max-width:360px;
}
.edit-modal h3{font-size:17px;color:#fff;margin-bottom:16px;text-align:center}
.edit-modal .edit-row{margin-bottom:14px}
.edit-modal .edit-row label{display:block;font-size:13px;color:#888;margin-bottom:4px}
.edit-modal .edit-row input,.edit-modal .edit-row select{
  width:100%;background:#0a0a0a;border:1px solid #333;border-radius:10px;
  padding:12px;color:#fff;font-size:16px;outline:none;
}
.edit-modal .edit-row input:focus,.edit-modal .edit-row select:focus{border-color:#0a84ff}
.edit-modal .edit-row select{appearance:none;-webkit-appearance:none}
.edit-buttons{display:flex;gap:8px;margin-top:16px}
.edit-buttons .btn{flex:1}

/* Toggle switch */
.toggle{position:relative;width:51px;height:31px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{
  position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;
  background:#39393d;border-radius:31px;transition:.3s;
}
.toggle .slider:before{
  content:"";position:absolute;height:27px;width:27px;left:2px;bottom:2px;
  background:#fff;border-radius:50%;transition:.3s;
}
.toggle input:checked+.slider{background:#30d158}
.toggle input:checked+.slider:before{transform:translateX(20px)}

.delete-btn{
  background:none;border:none;color:#ff453a;font-size:14px;cursor:pointer;
  padding:6px 10px;border-radius:8px;
}
.delete-btn:active{background:#2a1a1a}

/* Add alert form */
.add-form{
  background:#1a1a1a;border-radius:16px;padding:16px;margin:0 16px 16px;
}
.add-row{display:flex;gap:8px;margin-bottom:10px}
.add-row input,.add-row select{
  flex:1;background:#0a0a0a;border:1px solid #333;border-radius:10px;
  padding:12px;color:#fff;font-size:15px;outline:none;
}
.add-row select{appearance:none;-webkit-appearance:none;padding-right:12px;max-width:120px}
.add-row input:focus,.add-row select:focus{border-color:#0a84ff}
.symbol-info{font-size:12px;color:#888;margin-bottom:10px;min-height:16px}

/* Toast */
.toast{
  position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(100px);
  background:#333;color:#fff;padding:12px 24px;border-radius:12px;
  font-size:14px;z-index:100;transition:transform .3s ease;
  max-width:90%;text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.error{background:#ff3b30}
.toast.success{background:#30d158;color:#000}

/* Settings modal */
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);
  z-index:50;display:none;align-items:flex-end;justify-content:center;
}
.modal-overlay.show{display:flex}
.modal{
  background:#1c1c1e;border-radius:16px 16px 0 0;padding:20px;
  width:100%;max-width:500px;max-height:80vh;overflow-y:auto;
}
.modal h2{font-size:18px;color:#fff;margin-bottom:16px;text-align:center}

.empty-state{text-align:center;padding:40px 20px;color:#555;font-size:15px}
.loading{text-align:center;padding:20px;color:#555}
.refresh-note{text-align:center;font-size:11px;color:#444;margin-top:4px}
</style>
</head>
<body>

<div class="header">
  <h1>Stock Alerts</h1>
  <button class="gear-btn" onclick="showSettings()">&#9881;</button>
</div>

<!-- Setup Banner -->
<div id="setupBanner" class="setup-banner" style="display:none">
  <h2>Connect to GitHub</h2>
  <p class="note">Credentials are stored locally in your browser only.</p>
  <div class="input-group">
    <label>GitHub Personal Access Token</label>
    <input type="password" id="setupToken" placeholder="ghp_...">
  </div>
  <div class="input-group">
    <label>Repository Owner</label>
    <input type="text" id="setupOwner" placeholder="username">
  </div>
  <div class="input-group">
    <label>Repository Name</label>
    <input type="text" id="setupRepo" placeholder="stockalert">
  </div>
  <button class="btn btn-primary" onclick="saveSetup()">Save &amp; Connect</button>
</div>

<!-- Active Alerts -->
<div class="section">
  <div class="section-title">Active Alerts</div>
  <div id="alertsList" class="loading">Loading...</div>
  <div class="refresh-note" id="refreshNote">Auto-refreshes every 60s</div>
</div>

<!-- Add Alert -->
<div class="section">
  <div class="section-title">Add Alert</div>
  <div class="add-form">
    <div class="add-row">
      <input type="text" id="addSymbol" placeholder="Symbol (e.g. AAPL)" oninput="onSymbolInput()">
      <select id="addCondition">
        <option value="above">Above</option>
        <option value="below">Below</option>
      </select>
    </div>
    <div class="symbol-info" id="symbolInfo">&nbsp;</div>
    <div class="add-row">
      <input type="number" id="addTarget" placeholder="Target price" step="0.01">
    </div>
    <button class="btn btn-primary" onclick="addAlert()">Add Alert</button>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>Settings</h2>
    <div class="input-group">
      <label>GitHub Token</label>
      <input type="password" id="settingsToken">
    </div>
    <div class="input-group">
      <label>Repository Owner</label>
      <input type="text" id="settingsOwner">
    </div>
    <div class="input-group">
      <label>Repository Name</label>
      <input type="text" id="settingsRepo">
    </div>
    <button class="btn btn-primary" onclick="saveSettings()">Save</button>
    <button class="btn btn-secondary" onclick="hideSettings()">Cancel</button>
    <button class="btn btn-danger" style="margin-top:20px" onclick="clearSettings()">Clear All Data</button>
  </div>
</div>

<!-- Edit Alert Modal -->
<div class="edit-overlay" id="editModal">
  <div class="edit-modal">
    <h3 id="editTitle">Edit Alert</h3>
    <div class="edit-row">
      <label>Condition</label>
      <select id="editCondition">
        <option value="above">Above</option>
        <option value="below">Below</option>
      </select>
    </div>
    <div class="edit-row">
      <label>Target Price</label>
      <input type="number" id="editTarget" step="0.01">
    </div>
    <div class="edit-row">
      <label id="editCurrentLabel" style="color:#666">Current price: —</label>
    </div>
    <div class="edit-buttons">
      <button class="btn btn-secondary" onclick="hideEdit()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// --- Config ---
const STORAGE_KEY = 'stockalert_config';
const CONFIG_FILE = 'alerts_config.json';
let currentAlerts = [];
let currentSha = null;
let refreshTimer = null;
let symbolLookupTimer = null;

function getConfig() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null; } catch { return null; }
}
function setConfig(cfg) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
}

// --- Toast ---
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// --- GitHub API ---
async function ghGet(path) {
  const cfg = getConfig();
  if (!cfg) throw new Error('Not configured');
  const r = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`, {
    headers: {
      'Authorization': `token ${cfg.token}`,
      'Accept': 'application/vnd.github.v3+json'
    }
  });
  if (!r.ok) throw new Error(`GitHub GET failed: ${r.status}`);
  return r.json();
}

async function ghPut(path, content, sha, message) {
  const cfg = getConfig();
  if (!cfg) throw new Error('Not configured');
  const body = {
    message: message || 'Update alerts',
    content: btoa(unescape(encodeURIComponent(content))),
    sha: sha
  };
  const r = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`, {
    method: 'PUT',
    headers: {
      'Authorization': `token ${cfg.token}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  if (!r.ok) {
    const err = await r.text();
    throw new Error(`GitHub PUT failed: ${r.status} ${err}`);
  }
  return r.json();
}

// --- Load alerts from GitHub ---
async function loadAlerts() {
  const cfg = getConfig();
  if (!cfg) {
    document.getElementById('alertsList').innerHTML = '<div class="empty-state">Configure GitHub connection to get started.</div>';
    return;
  }
  try {
    const file = await ghGet(CONFIG_FILE);
    currentSha = file.sha;
    const decoded = decodeURIComponent(escape(atob(file.content.replace(/\n/g, ''))));
    const data = JSON.parse(decoded);
    currentAlerts = data.alerts || [];
    renderAlerts();
    fetchPrices();
    updateRefreshNote();
  } catch (e) {
    document.getElementById('alertsList').innerHTML = '<div class="empty-state">Failed to load alerts. Check settings.</div>';
    showToast('Load failed: ' + e.message, 'error');
  }
}

function updateRefreshNote() {
  const note = document.getElementById('refreshNote');
  if (priceUpdateTime === 'live') {
    note.textContent = 'Prices: live from local server';
  } else if (priceUpdateTime) {
    note.textContent = `Prices updated: ${priceUpdateTime}`;
  } else {
    note.textContent = 'Auto-refreshes every 60s';
  }
}

// --- Save alerts to GitHub ---
async function saveAlerts(message) {
  try {
    // Get fresh sha first
    const file = await ghGet(CONFIG_FILE);
    currentSha = file.sha;
    const content = JSON.stringify({ alerts: currentAlerts }, null, 2) + '\n';
    const result = await ghPut(CONFIG_FILE, content, currentSha, message || 'Update alerts from web UI');
    currentSha = result.content.sha;
    showToast('Saved to GitHub', 'success');
    // Try to update local server too (ignore errors)
    tryLocalUpdate();
  } catch (e) {
    showToast('Save failed: ' + e.message, 'error');
    throw e;
  }
}

function tryLocalUpdate() {
  fetch('http://localhost:8080/api/alerts', { method: 'GET' }).catch(() => {});
}

// --- Price fetching ---
let priceCache = {};
let priceUpdateTime = '';

async function fetchPrices() {
  if (currentAlerts.length === 0) return;

  // Try local server first (works when MacBook is on)
  try {
    const symbols = [...new Set(currentAlerts.map(a => a.symbol))];
    const r = await fetch(`http://localhost:8080/api/quotes?symbols=${symbols.join(',')}`, { signal: AbortSignal.timeout(2000) });
    if (r.ok) {
      const data = await r.json();
      if (data && typeof data === 'object') {
        for (const [sym, info] of Object.entries(data)) {
          if (info && info.price) priceCache[sym] = info.price;
        }
        priceUpdateTime = 'live';
        renderAlerts();
        return;
      }
    }
  } catch {}

  // Fallback: read prices.json from GitHub (updated every 5 min by workflow)
  try {
    const file = await ghGet('prices.json');
    const decoded = decodeURIComponent(escape(atob(file.content.replace(/\n/g, ''))));
    const data = JSON.parse(decoded);
    if (data.prices) {
      for (const [sym, info] of Object.entries(data.prices)) {
        if (info && info.price) priceCache[sym] = info.price;
      }
      priceUpdateTime = data.updated || '';
      renderAlerts();
    }
  } catch {}
}

// --- Render alerts ---
function renderAlerts() {
  const container = document.getElementById('alertsList');
  if (currentAlerts.length === 0) {
    container.innerHTML = '<div class="empty-state">No alerts configured. Add one below.</div>';
    return;
  }
  container.innerHTML = currentAlerts.map((a, i) => {
    const price = priceCache[a.symbol];
    const priceStr = price ? price.toFixed(2) : '—';
    const disabledClass = a.enabled ? '' : ' disabled';
    const checkedAttr = a.enabled ? ' checked' : '';

    // Calculate distance to target
    let diffHtml = '';
    if (price) {
      const diff = ((a.target_price - price) / price * 100);
      const absDiff = Math.abs(diff).toFixed(1);
      const nearClass = Math.abs(diff) < 3 ? 'near' : 'far';
      const arrow = diff > 0 ? '↑' : '↓';
      diffHtml = `<div class="price-diff ${nearClass}">${arrow} ${absDiff}% to target</div>`;
    }

    return `<div class="alert-card ${a.condition}${disabledClass}">
      <div class="row" onclick="editAlert(${i})" style="cursor:pointer">
        <div>
          <div class="symbol">${esc(a.symbol)}</div>
          <div class="name">${esc(a.name || '')}</div>
          <span class="condition-badge ${a.condition}">${a.condition === 'above' ? '&#9650; Above' : '&#9660; Below'}</span>
        </div>
        <div class="prices">
          <div class="current">${priceStr}</div>
          <div class="target">Target: ${a.target_price.toFixed(2)}</div>
          ${diffHtml}
        </div>
      </div>
      <div class="actions">
        <label class="toggle">
          <input type="checkbox"${checkedAttr} onchange="event.stopPropagation();toggleAlert(${i}, this.checked)">
          <span class="slider"></span>
        </label>
        <button class="delete-btn" onclick="editAlert(${i})">Edit</button>
        <button class="delete-btn" onclick="deleteAlert(${i})">Delete</button>
      </div>
    </div>`;
  }).join('');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// --- Alert actions ---
async function toggleAlert(index, enabled) {
  currentAlerts[index].enabled = enabled;
  renderAlerts();
  try {
    await saveAlerts(`${enabled ? 'Enable' : 'Disable'} alert: ${currentAlerts[index].symbol}`);
  } catch {
    currentAlerts[index].enabled = !enabled;
    renderAlerts();
  }
}

async function deleteAlert(index) {
  const alert = currentAlerts[index];
  if (!confirm(`Delete alert for ${alert.symbol}?`)) return;
  currentAlerts.splice(index, 1);
  renderAlerts();
  try {
    await saveAlerts(`Remove alert: ${alert.symbol}`);
  } catch {
    await loadAlerts();
  }
}

async function addAlert() {
  const symbol = document.getElementById('addSymbol').value.trim().toUpperCase();
  const condition = document.getElementById('addCondition').value;
  const target = parseFloat(document.getElementById('addTarget').value);
  if (!symbol) { showToast('Enter a symbol', 'error'); return; }
  if (isNaN(target) || target <= 0) { showToast('Enter a valid target price', 'error'); return; }

  const name = document.getElementById('symbolInfo').dataset.name || symbol;
  const newAlert = { symbol, name, condition, target_price: target, enabled: true };
  currentAlerts.push(newAlert);
  renderAlerts();
  try {
    await saveAlerts(`Add alert: ${symbol} ${condition} ${target}`);
    document.getElementById('addSymbol').value = '';
    document.getElementById('addTarget').value = '';
    document.getElementById('symbolInfo').innerHTML = '&nbsp;';
    document.getElementById('symbolInfo').dataset.name = '';
    fetchPrices();
  } catch {
    currentAlerts.pop();
    renderAlerts();
  }
}

// --- Edit alert ---
let editIndex = -1;

function editAlert(index) {
  editIndex = index;
  const a = currentAlerts[index];
  const price = priceCache[a.symbol];
  document.getElementById('editTitle').textContent = `Edit ${a.symbol}`;
  document.getElementById('editCondition').value = a.condition;
  document.getElementById('editTarget').value = a.target_price;
  document.getElementById('editCurrentLabel').textContent = price
    ? `Current price: ${price.toFixed(2)}`
    : 'Current price: unavailable';
  document.getElementById('editModal').classList.add('show');
}

function hideEdit() {
  document.getElementById('editModal').classList.remove('show');
  editIndex = -1;
}

async function saveEdit() {
  if (editIndex < 0) return;
  const condition = document.getElementById('editCondition').value;
  const target = parseFloat(document.getElementById('editTarget').value);
  if (isNaN(target) || target <= 0) { showToast('Enter a valid price', 'error'); return; }

  const oldCondition = currentAlerts[editIndex].condition;
  const oldTarget = currentAlerts[editIndex].target_price;
  currentAlerts[editIndex].condition = condition;
  currentAlerts[editIndex].target_price = target;
  renderAlerts();
  hideEdit();

  try {
    await saveAlerts(`Edit alert: ${currentAlerts[editIndex].symbol} ${condition} ${target}`);
  } catch {
    currentAlerts[editIndex].condition = oldCondition;
    currentAlerts[editIndex].target_price = oldTarget;
    renderAlerts();
  }
}

// Close edit modal on backdrop tap
document.addEventListener('click', (e) => {
  if (e.target.id === 'editModal') hideEdit();
});

// --- Symbol lookup ---
function onSymbolInput() {
  clearTimeout(symbolLookupTimer);
  const sym = document.getElementById('addSymbol').value.trim();
  if (sym.length < 1) {
    document.getElementById('symbolInfo').innerHTML = '&nbsp;';
    return;
  }
  symbolLookupTimer = setTimeout(() => lookupSymbol(sym), 500);
}

async function lookupSymbol(sym) {
  const info = document.getElementById('symbolInfo');
  info.textContent = 'Looking up...';

  // Try local server
  try {
    const r = await fetch(`http://localhost:8080/api/quotes?symbols=${encodeURIComponent(sym)}`, { signal: AbortSignal.timeout(2000) });
    if (r.ok) {
      const data = await r.json();
      const q = data[sym.toUpperCase()] || data[sym];
      if (q && q.price) {
        info.textContent = `${q.name || sym} - Current: ${q.price.toFixed(2)}`;
        info.dataset.name = q.name || sym;
        return;
      }
    }
  } catch {}

  // Try Yahoo Finance directly
  try {
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=1d`;
    const r = await fetch(url, { signal: AbortSignal.timeout(3000) });
    if (r.ok) {
      const data = await r.json();
      const meta = data?.chart?.result?.[0]?.meta;
      if (meta) {
        const price = meta.regularMarketPrice;
        const name = meta.shortName || sym;
        info.textContent = `${name} - Current: ${price.toFixed(2)}`;
        info.dataset.name = name;
        return;
      }
    }
  } catch {}

  info.textContent = 'Price unavailable (will still alert via cloud monitor)';
  info.dataset.name = sym.toUpperCase();
}

// --- Settings ---
function showSettings() {
  const cfg = getConfig() || {};
  document.getElementById('settingsToken').value = cfg.token || '';
  document.getElementById('settingsOwner').value = cfg.owner || '';
  document.getElementById('settingsRepo').value = cfg.repo || '';
  document.getElementById('settingsModal').classList.add('show');
}
function hideSettings() {
  document.getElementById('settingsModal').classList.remove('show');
}
function saveSettings() {
  const token = document.getElementById('settingsToken').value.trim();
  const owner = document.getElementById('settingsOwner').value.trim();
  const repo = document.getElementById('settingsRepo').value.trim();
  if (!token || !owner || !repo) { showToast('All fields required', 'error'); return; }
  setConfig({ token, owner, repo });
  hideSettings();
  document.getElementById('setupBanner').style.display = 'none';
  showToast('Settings saved', 'success');
  loadAlerts();
}
function clearSettings() {
  if (!confirm('Clear all stored data?')) return;
  localStorage.removeItem(STORAGE_KEY);
  hideSettings();
  location.reload();
}

// --- Setup ---
function saveSetup() {
  const token = document.getElementById('setupToken').value.trim();
  const owner = document.getElementById('setupOwner').value.trim();
  const repo = document.getElementById('setupRepo').value.trim();
  if (!token || !owner || !repo) { showToast('All fields required', 'error'); return; }
  setConfig({ token, owner, repo });
  document.getElementById('setupBanner').style.display = 'none';
  showToast('Connected to GitHub', 'success');
  loadAlerts();
}

// --- Init ---
function init() {
  const cfg = getConfig();
  if (!cfg) {
    document.getElementById('setupBanner').style.display = 'block';
    document.getElementById('alertsList').innerHTML = '<div class="empty-state">Configure GitHub connection to get started.</div>';
  } else {
    loadAlerts();
  }
  // Auto-refresh every 60s
  refreshTimer = setInterval(() => {
    if (getConfig()) loadAlerts();
  }, 60000);
}

init();
</script>
</body>
