<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StockAlert">

<title>StockAlert</title>
<style>
:root {
  --bg: #0a0a0a;
  --surface: #1a1a1a;
  --surface2: #252525;
  --border: #333;
  --text: #f0f0f0;
  --text2: #888;
  --text3: #555;
  --blue: #4a9eff;
  --green: #34c759;
  --red: #ff3b30;
  --orange: #ff9500;
  --yellow: #ffd60a;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

/* App Layout */
.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

.header {
  padding: calc(var(--safe-top) + 8px) 16px 8px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.header h1 {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 4px;
}

.header .subtitle {
  font-size: 12px;
  color: var(--text2);
}

.content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 90px;
}

/* Tab Bar */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  background: rgba(26, 26, 26, 0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  padding: 6px 0 calc(var(--safe-bottom) + 6px);
  z-index: 100;
}

.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 6px;
  color: var(--text3);
  border: none;
  background: none;
  font-size: 10px;
  cursor: pointer;
  position: relative;
  transition: color 0.2s;
}

.tab.active { color: var(--blue); }
.tab svg { width: 24px; height: 24px; margin-bottom: 2px; }

.tab .badge {
  position: absolute;
  top: 2px;
  right: calc(50% - 20px);
  background: var(--red);
  color: white;
  font-size: 10px;
  font-weight: 600;
  min-width: 16px;
  height: 16px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
}

/* Search Bar */
.search-bar {
  padding: 8px 16px;
  flex-shrink: 0;
}

.search-bar input {
  width: 100%;
  padding: 10px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-size: 15px;
  outline: none;
}

.search-bar input::placeholder { color: var(--text3); }
.search-bar input:focus { border-color: var(--blue); }

/* Filter Chips */
.filters {
  display: flex;
  gap: 8px;
  padding: 4px 16px 8px;
  overflow-x: auto;
  flex-shrink: 0;
  scrollbar-width: none;
}
.filters::-webkit-scrollbar { display: none; }

.chip {
  padding: 7px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text2);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}

.chip.active {
  background: var(--blue);
  border-color: var(--blue);
  color: white;
}

/* Stock List */
.stock-item {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  gap: 12px;
  cursor: pointer;
  transition: background 0.15s;
}

.stock-item:active { background: var(--surface); }

.star-btn, .bell-btn {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  padding: 4px;
  line-height: 1;
}

.star-btn { color: var(--text3); }
.star-btn.active { color: var(--yellow); }
.bell-btn { color: var(--blue); }

.stock-info { flex: 1; min-width: 0; }
.stock-info .symbol { font-weight: 600; font-size: 15px; }
.stock-info .name { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stock-info .index-tag { font-size: 10px; color: var(--text3); }

.stock-price { text-align: right; }
.stock-price .price { font-weight: 600; font-size: 15px; }
.stock-price .change { font-size: 12px; font-weight: 500; }
.stock-price .change.up { color: var(--green); }
.stock-price .change.down { color: var(--red); }

/* Empty State */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 40px;
  color: var(--text3);
  text-align: center;
}

.empty-state .icon { font-size: 48px; margin-bottom: 16px; }
.empty-state h3 { color: var(--text2); margin-bottom: 8px; }
.empty-state p { font-size: 14px; line-height: 1.5; }

/* Alert Items */
.alert-item {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}

.alert-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.alert-icon.above { background: rgba(52,199,89,0.15); color: var(--green); }
.alert-icon.below { background: rgba(255,59,48,0.15); color: var(--red); }
.alert-icon.triggered { background: rgba(255,149,0,0.15); color: var(--orange); }

.alert-info { flex: 1; }
.alert-info .stock-name { font-weight: 600; font-size: 15px; }
.alert-info .alert-desc { font-size: 13px; color: var(--text2); }

.alert-actions { display: flex; gap: 8px; align-items: center; }

.toggle-switch {
  width: 48px;
  height: 28px;
  background: var(--text3);
  border-radius: 14px;
  position: relative;
  cursor: pointer;
  transition: background 0.3s;
  border: none;
}

.toggle-switch.on { background: var(--green); }

.toggle-switch::after {
  content: '';
  position: absolute;
  width: 24px;
  height: 24px;
  background: white;
  border-radius: 12px;
  top: 2px;
  left: 2px;
  transition: transform 0.3s;
}

.toggle-switch.on::after { transform: translateX(20px); }

.delete-btn {
  background: none;
  border: none;
  color: var(--red);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
}

.reset-btn {
  padding: 6px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--blue);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

/* Section Headers */
.section-header {
  padding: 20px 16px 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Modal / Sheet */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.modal-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.modal {
  width: 100%;
  max-height: 90dvh;
  background: var(--surface);
  border-radius: 16px 16px 0 0;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  padding-bottom: calc(var(--safe-bottom) + 16px);
}

.modal-overlay.show .modal { transform: translateY(0); }

.modal-handle {
  width: 36px;
  height: 5px;
  background: var(--text3);
  border-radius: 3px;
  margin: 8px auto 4px;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}

.modal-header h2 { font-size: 17px; font-weight: 600; }

.modal-header button {
  background: none;
  border: none;
  font-size: 15px;
  cursor: pointer;
  padding: 4px 8px;
}

.modal-cancel { color: var(--text2); }
.modal-save { color: var(--blue); font-weight: 600; }
.modal-save:disabled { color: var(--text3); }

.modal-body { padding: 16px; }

/* Form Elements */
.form-section { margin-bottom: 20px; }
.form-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  display: block;
}

.stock-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px;
  background: var(--surface2);
  border-radius: 12px;
}

.stock-card .name { font-weight: 600; font-size: 16px; }
.stock-card .sym { font-size: 13px; color: var(--text2); }
.stock-card .current-price { font-size: 22px; font-weight: 700; }
.stock-card .current-change { font-size: 12px; font-weight: 500; }

.type-picker {
  display: flex;
  gap: 8px;
}

.type-option {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  background: var(--surface2);
  border: 2px solid var(--border);
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
}

.type-option.selected.above { border-color: var(--green); background: rgba(52,199,89,0.1); }
.type-option.selected.below { border-color: var(--red); background: rgba(255,59,48,0.1); }

.type-option .type-icon { font-size: 24px; margin-bottom: 4px; }
.type-option .type-label { font-size: 13px; font-weight: 600; }

.price-input-wrap {
  display: flex;
  align-items: center;
  background: var(--surface2);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  gap: 8px;
  transition: border-color 0.2s;
}

.price-input-wrap:focus-within { border-color: var(--blue); }

.price-input-wrap .currency {
  font-size: 22px;
  color: var(--text2);
  font-weight: 500;
}

.price-input-wrap input {
  flex: 1;
  background: none;
  border: none;
  color: var(--text);
  font-size: 22px;
  font-weight: 600;
  outline: none;
  width: 100%;
}

.price-diff {
  text-align: right;
  font-size: 13px;
  color: var(--text2);
  margin-top: 6px;
}

.existing-alerts { margin-top: 8px; }
.existing-alert {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--surface2);
  border-radius: 8px;
  margin-bottom: 4px;
  font-size: 13px;
}

/* Loading */
.loading {
  display: flex;
  justify-content: center;
  padding: 20px;
}

.spinner {
  width: 24px;
  height: 24px;
  border: 2px solid var(--border);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Notification banner */
.notif-banner {
  position: fixed;
  top: var(--safe-top);
  left: 8px;
  right: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  z-index: 300;
  display: flex;
  align-items: center;
  gap: 12px;
  transform: translateY(-120%);
  transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.notif-banner.show { transform: translateY(8px); }
.notif-banner .notif-icon { font-size: 28px; }
.notif-banner .notif-text { flex: 1; }
.notif-banner .notif-title { font-weight: 600; font-size: 14px; }
.notif-banner .notif-body { font-size: 13px; color: var(--text2); margin-top: 2px; }

/* Pull to refresh indicator */
.refresh-indicator {
  text-align: center;
  padding: 8px;
  color: var(--text3);
  font-size: 12px;
}
</style>
</head>

// ============================================================

let state = {
  tab: 'stocks',
  filter: 'all',
  search: '',
  prices: {},           // { symbol: { price, previousClose, changePercent, currency } }
  favorites: new Set(),  // Set of symbols
  alerts: [],           // [{ id, symbol, name, index, type:'above'|'below', target, active, triggered }]
  loading: false,
  lastUpdated: null,
};

// Load persisted state
function loadState() {
  try {
    const favs = localStorage.getItem('sa_favorites');
    if (favs) state.favorites = new Set(JSON.parse(favs));
    const alerts = localStorage.getItem('sa_alerts');
    if (alerts) state.alerts = JSON.parse(alerts);
  } catch (e) { /* ignore */ }
}

function saveState() {
  localStorage.setItem('sa_favorites', JSON.stringify([...state.favorites]));
  localStorage.setItem('sa_alerts', JSON.stringify(state.alerts));
}

// ============================================================
// API
// ============================================================

async function fetchPrices(symbols) {
  if (!symbols.length) return;
  const unique = [...new Set(symbols)];
  // Fetch in batches of 20
  for (let i = 0; i < unique.length; i += 20) {
    const batch = unique.slice(i, i + 20).join(',');
    try {
      const resp = await fetch(`/api/quotes?symbols=${encodeURIComponent(batch)}`);
      if (!resp.ok) continue;
      const data = await resp.json();
      if (data.error) continue;
      Object.assign(state.prices, data);
    } catch (e) {
      console.error('Fetch error:', e);
    }
  }
}

async function fetchAllPrices() {
  state.loading = true;
  render();

  // Collect unique symbols
  const seen = new Set();
  const allSymbols = [];
  for (const idx of Object.keys(STOCKS)) {
    for (const s of STOCKS[idx]) {
      if (!seen.has(s.symbol)) {
        seen.add(s.symbol);
        allSymbols.push(s.symbol);
      }
    }
  }

  // Fetch favorites and alert symbols first (priority)
  const priority = [...state.favorites, ...state.alerts.filter(a => a.active).map(a => a.symbol)];
  const priorityUnique = [...new Set(priority)].filter(s => allSymbols.includes(s));
  const rest = allSymbols.filter(s => !priorityUnique.includes(s));

  if (priorityUnique.length) {
    await fetchPrices(priorityUnique);
    state.lastUpdated = new Date();
    checkAlerts();
    render();
  }

  // Then fetch the rest
  await fetchPrices(rest);
  state.loading = false;
  state.lastUpdated = new Date();
  checkAlerts();
  render();
}

// ============================================================
// ALERTS
// ============================================================

function checkAlerts() {
  for (const alert of state.alerts) {
    if (!alert.active || alert.triggered) continue;
    const quote = state.prices[alert.symbol];
    if (!quote || !quote.price) continue;

    const triggered = alert.type === 'above'
      ? quote.price >= alert.target
      : quote.price <= alert.target;

    if (triggered) {
      alert.triggered = true;
      alert.active = false;
      const dir = alert.type === 'above' ? 'gestegen boven' : 'gedaald onder';
      const curr = getCurrency(alert.index);
      const title = `Koersalarm: ${alert.name}`;
      const body = `${alert.name} is ${dir} ${curr}${alert.target.toFixed(2)}. Huidige koers: ${curr}${quote.price.toFixed(2)}`;
      showNotification(title, body);
      showInAppNotification(title, body);
    }
  }
  saveState();
  updateBadge();
}

function showNotification(title, body) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, { body, icon: '/icons/icon-192.png', badge: '/icons/icon-192.png' });
  }
}

function showInAppNotification(title, body) {
  const banner = document.getElementById('notif-banner');
  document.getElementById('notif-title').textContent = title;
  document.getElementById('notif-body').textContent = body;
  banner.classList.add('show');
  setTimeout(() => banner.classList.remove('show'), 5000);
}

function updateBadge() {
  const count = state.alerts.filter(a => a.active && !a.triggered).length;
  const badge = document.getElementById('alert-badge');
  if (count > 0) {
    badge.textContent = count;
    badge.style.display = '';
  } else {
    badge.style.display = 'none';
  }
}

// ============================================================
// HELPERS
// ============================================================

function getCurrency(index) {
  return index === 'AEX' ? '\u20AC' : '$';
}

function formatPrice(symbol, index) {
  const q = state.prices[symbol];
  if (!q || !q.price) return '\u2013';
  return getCurrency(index) + q.price.toFixed(2);
}

function formatChange(symbol) {
  const q = state.prices[symbol];
  if (!q || q.changePercent == null) return '';
  const sign = q.changePercent >= 0 ? '+' : '';
  return sign + q.changePercent.toFixed(2) + '%';
}

function isUp(symbol) {
  const q = state.prices[symbol];
  return q && q.changePercent >= 0;
}

function getStocksByFilter() {
  let stocks = [];
  if (state.filter === 'all') {
    // Deduplicate by symbol, keep first occurrence
    const seen = new Set();
    for (const idx of Object.keys(STOCKS)) {
      for (const s of STOCKS[idx]) {
        if (!seen.has(s.symbol)) {
          seen.add(s.symbol);
          stocks.push({ ...s, index: idx });
        }
      }
    }
  } else {
    stocks = STOCKS[state.filter].map(s => ({ ...s, index: state.filter }));
  }

  if (state.search) {
    const q = state.search.toLowerCase();
    stocks = stocks.filter(s =>
      s.name.toLowerCase().includes(q) || s.symbol.toLowerCase().includes(q)
    );
  }

  return stocks;
}

// ============================================================
// RENDER
// ============================================================

function render() {
  const content = document.getElementById('content');
  const title = document.getElementById('page-title');
  const searchSection = document.getElementById('search-section');
  const filtersSection = document.getElementById('filters-section');
  const updated = document.getElementById('last-updated');

  // Update header
  if (state.lastUpdated) {
    updated.textContent = 'Bijgewerkt om ' + state.lastUpdated.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
  }

  switch (state.tab) {
    case 'stocks':
      title.textContent = 'Aandelen';
      searchSection.style.display = '';
      filtersSection.style.display = '';
      content.innerHTML = renderStockList(getStocksByFilter());
      break;
    case 'favorites':
      title.textContent = 'Favorieten';
      searchSection.style.display = 'none';
      filtersSection.style.display = 'none';
      content.innerHTML = renderFavorites();
      break;
    case 'alerts':
      title.textContent = 'Alarmen';
      searchSection.style.display = 'none';
      filtersSection.style.display = 'none';
      content.innerHTML = renderAlerts();
      break;
  }

  if (state.loading) {
    content.innerHTML = '<div class="loading"><div class="spinner"></div></div>' + content.innerHTML;
  }

  updateBadge();
}

function renderStockList(stocks) {
  if (!stocks.length) {
    return `<div class="empty-state">
      <div class="icon">&#x1F50D;</div>
      <h3>Geen resultaten</h3>
      <p>Probeer een andere zoekterm</p>
    </div>`;
  }
  return stocks.map(s => stockItemHTML(s)).join('');
}

function stockItemHTML(s) {
  const fav = state.favorites.has(s.symbol);
  const change = formatChange(s.symbol);
  const up = isUp(s.symbol);
  return `<div class="stock-item" onclick="event.stopPropagation()">
    <button class="star-btn ${fav ? 'active' : ''}" onclick="toggleFavorite('${s.symbol}')">
      ${fav ? '&#9733;' : '&#9734;'}
    </button>
    <div class="stock-info">
      <div class="symbol">${s.symbol.replace('.AS', '')}</div>
      <div class="name">${s.name}</div>
      <div class="index-tag">${s.index}</div>
    </div>
    <div class="stock-price">
      <div class="price">${formatPrice(s.symbol, s.index)}</div>
      ${change ? `<div class="change ${up ? 'up' : 'down'}">${change}</div>` : ''}
    </div>
    <button class="bell-btn" onclick="openAlertModal('${s.symbol}', '${s.name.replace(/'/g, "\\'")}', '${s.index}')">&#x1F514;</button>
  </div>`;
}

function renderFavorites() {
  const favStocks = [];
  const seen = new Set();
  for (const idx of Object.keys(STOCKS)) {
    for (const s of STOCKS[idx]) {
      if (state.favorites.has(s.symbol) && !seen.has(s.symbol)) {
        seen.add(s.symbol);
        favStocks.push({ ...s, index: idx });
      }
    }
  }

  if (!favStocks.length) {
    return `<div class="empty-state">
      <div class="icon">&#9734;</div>
      <h3>Geen favorieten</h3>
      <p>Tik op de ster bij een aandeel om het als favoriet toe te voegen</p>
    </div>`;
  }

  return favStocks.map(s => stockItemHTML(s)).join('');
}

function renderAlerts() {
  if (!state.alerts.length) {
    return `<div class="empty-state">
      <div class="icon">&#x1F515;</div>
      <h3>Geen alarmen</h3>
      <p>Tik op het bel-icoon bij een aandeel om een koersalarm in te stellen</p>
    </div>`;
  }

  let html = '';
  const active = state.alerts.filter(a => a.active && !a.triggered);
  const triggered = state.alerts.filter(a => a.triggered);
  const inactive = state.alerts.filter(a => !a.active && !a.triggered);

  if (active.length) {
    html += '<div class="section-header">Actieve alarmen</div>';
    html += active.map(a => alertItemHTML(a)).join('');
  }

  if (triggered.length) {
    html += '<div class="section-header">Afgegane alarmen</div>';
    html += triggered.map(a => triggeredAlertHTML(a)).join('');
  }

  if (inactive.length) {
    html += '<div class="section-header">Gepauzeerde alarmen</div>';
    html += inactive.map(a => alertItemHTML(a)).join('');
  }

  return html;
}

function alertItemHTML(a) {
  const curr = getCurrency(a.index);
  return `<div class="alert-item">
    <div class="alert-icon ${a.type}">${a.type === 'above' ? '&#8593;' : '&#8595;'}</div>
    <div class="alert-info">
      <div class="stock-name">${a.name}</div>
      <div class="alert-desc">${a.type === 'above' ? 'Boven' : 'Onder'} ${curr}${a.target.toFixed(2)}</div>
    </div>
    <div class="alert-actions">
      <button class="toggle-switch ${a.active ? 'on' : ''}" onclick="toggleAlertActive('${a.id}')"></button>
      <button class="delete-btn" onclick="deleteAlert('${a.id}')">&#x2715;</button>
    </div>
  </div>`;
}

function triggeredAlertHTML(a) {
  const curr = getCurrency(a.index);
  return `<div class="alert-item">
    <div class="alert-icon triggered">&#x2713;</div>
    <div class="alert-info">
      <div class="stock-name">${a.name}</div>
      <div class="alert-desc">${a.type === 'above' ? 'Boven' : 'Onder'} ${curr}${a.target.toFixed(2)}</div>
    </div>
    <div class="alert-actions">
      <button class="reset-btn" onclick="resetAlert('${a.id}')">Opnieuw</button>
      <button class="delete-btn" onclick="deleteAlert('${a.id}')">&#x2715;</button>
    </div>
  </div>`;
}

// ============================================================
// ACTIONS
// ============================================================

function toggleFavorite(symbol) {
  if (state.favorites.has(symbol)) {
    state.favorites.delete(symbol);
  } else {
    state.favorites.add(symbol);
  }
  saveState();
  render();
}

function toggleAlertActive(id) {
  const a = state.alerts.find(a => a.id === id);
  if (a) { a.active = !a.active; saveState(); render(); }
}

function deleteAlert(id) {
  state.alerts = state.alerts.filter(a => a.id !== id);
  saveState();
  render();
}

function resetAlert(id) {
  const a = state.alerts.find(a => a.id === id);
  if (a) { a.triggered = false; a.active = true; saveState(); render(); }
}

// ============================================================
// ALERT MODAL
// ============================================================

let modalStock = null;

function openAlertModal(symbol, name, index) {
  modalStock = { symbol, name, index };
  const modal = document.getElementById('alert-modal');
  const body = document.getElementById('modal-body');
  const q = state.prices[symbol];
  const curr = getCurrency(index);
  const price = q ? q.price : null;
  const change = q ? q.changePercent : null;

  const existing = state.alerts.filter(a => a.symbol === symbol && a.active);

  body.innerHTML = `
    <div class="form-section">
      <div class="form-label">Aandeel</div>
      <div class="stock-card">
        <div>
          <div class="name">${name}</div>
          <div class="sym">${symbol.replace('.AS', '')} &middot; ${index}</div>
        </div>
        <div style="text-align:right">
          <div class="current-price">${price ? curr + price.toFixed(2) : '\u2013'}</div>
          ${change != null ? `<div class="current-change" style="color:${change >= 0 ? 'var(--green)' : 'var(--red)'}">${change >= 0 ? '+' : ''}${change.toFixed(2)}%</div>` : ''}
        </div>
      </div>
    </div>
    <div class="form-section">
      <div class="form-label">Waarschuw mij wanneer de koers</div>
      <div class="type-picker">
        <div class="type-option above selected" id="type-above" onclick="selectAlertType('above')">
          <div class="type-icon">&#8593;</div>
          <div class="type-label">Boven niveau</div>
        </div>
        <div class="type-option below" id="type-below" onclick="selectAlertType('below')">
          <div class="type-icon">&#8595;</div>
          <div class="type-label">Onder niveau</div>
        </div>
      </div>
    </div>
    <div class="form-section">
      <div class="form-label">Doelkoers</div>
      <div class="price-input-wrap">
        <span class="currency">${curr}</span>
        <input type="number" step="0.01" id="target-price" placeholder="0.00"
          value="${price ? price.toFixed(2) : ''}" inputmode="decimal" oninput="updatePriceDiff()">
      </div>
      <div class="price-diff" id="price-diff"></div>
    </div>
    ${existing.length ? `
      <div class="form-section">
        <div class="form-label">Bestaande alarmen</div>
        <div class="existing-alerts">
          ${existing.map(a => `<div class="existing-alert">
            <span>${a.type === 'above' ? '&#8593;' : '&#8595;'}</span>
            <span>${a.type === 'above' ? 'Boven' : 'Onder'} ${curr}${a.target.toFixed(2)}</span>
          </div>`).join('')}
        </div>
      </div>
    ` : ''}
  `;

  modal.classList.add('show');
  modalAlertType = 'above';
  setTimeout(() => document.getElementById('target-price').focus(), 400);
  updatePriceDiff();
}

let modalAlertType = 'above';

function selectAlertType(type) {
  modalAlertType = type;
  document.getElementById('type-above').className = 'type-option above' + (type === 'above' ? ' selected' : '');
  document.getElementById('type-below').className = 'type-option below' + (type === 'below' ? ' selected' : '');
}

function updatePriceDiff() {
  if (!modalStock) return;
  const q = state.prices[modalStock.symbol];
  const input = document.getElementById('target-price');
  const diff = document.getElementById('price-diff');
  if (!q || !input || !diff) return;

  const target = parseFloat(input.value);
  if (isNaN(target) || !q.price) { diff.textContent = ''; return; }

  const pct = ((target - q.price) / q.price * 100);
  const sign = pct >= 0 ? '+' : '';
  diff.innerHTML = `Verschil: <span style="color:${pct >= 0 ? 'var(--green)' : 'var(--red)'}; font-weight:600">${sign}${pct.toFixed(1)}%</span>`;
}

function closeAlertModal() {
  document.getElementById('alert-modal').classList.remove('show');
  modalStock = null;
}

function saveAlert() {
  if (!modalStock) return;
  const input = document.getElementById('target-price');
  const target = parseFloat(input.value);
  if (isNaN(target) || target <= 0) return;

  state.alerts.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    symbol: modalStock.symbol,
    name: modalStock.name,
    index: modalStock.index,
    type: modalAlertType,
    target: target,
    active: true,
    triggered: false,
  });

  saveState();
  closeAlertModal();
  render();
}

// Close modal on overlay click
document.getElementById('alert-modal').addEventListener('click', function(e) {
  if (e.target === this) closeAlertModal();
});

// ============================================================
// TAB NAVIGATION
// ============================================================

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    state.tab = tab.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    render();
  });
});

// ============================================================
// FILTERS
// ============================================================

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    state.filter = chip.dataset.index;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    render();
  });
});

// ============================================================
// SEARCH
// ============================================================

document.getElementById('search-input').addEventListener('input', (e) => {
  state.search = e.target.value;
  render();
});

// ============================================================
// NOTIFICATIONS PERMISSION
// ============================================================

async function requestNotifications() {
  if ('Notification' in window && Notification.permission === 'default') {
    await Notification.requestPermission();
  }
}

// ============================================================
// SERVICE WORKER
// ============================================================

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

// ============================================================
// AUTO-REFRESH
// ============================================================

let refreshInterval = null;

function startAutoRefresh() {
  if (refreshInterval) clearInterval(refreshInterval);
  refreshInterval = setInterval(async () => {
    // Only fetch symbols we care about (favorites + alerts)
    const importantSymbols = [
      ...state.favorites,
      ...state.alerts.filter(a => a.active && !a.triggered).map(a => a.symbol),
    ];

    if (importantSymbols.length > 0) {
      await fetchPrices([...new Set(importantSymbols)]);
      state.lastUpdated = new Date();
      checkAlerts();
      render();
    }
  }, 30000); // Every 30 seconds
}

// ============================================================
// INIT
// ============================================================

loadState();
render();
requestNotifications();

// Initial fetch
fetchAllPrices().then(() => {
  startAutoRefresh();
});

// Refetch when app comes to foreground
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    fetchAllPrices();
  }
});
</script>
</body>
