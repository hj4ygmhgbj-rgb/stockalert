name: Stock Price Monitor

on:
  schedule:
    # Every 5 minutes, Mon-Fri, 07:00-21:30 UTC (covers AEX + NYSE hours)
    - cron: '*/5 7-21 * * 1-5'
  workflow_dispatch: # Allow manual trigger from GitHub

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download triggered alerts state
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: triggered-alerts
          path: .

      - name: Check stock prices and send alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 cloud_monitor.py

      - name: Save triggered alerts state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triggered-alerts
          path: triggered_alerts.json
          overwrite: true
          if-no-files-found: ignore
